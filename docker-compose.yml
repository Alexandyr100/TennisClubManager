services:
  postgres-db:
    image: postgres:16-alpine
    container_name: tennis-club-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tennis_club_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tennis_club_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tennis-net

volumes:
  pgdata:

networks:
  tennis-net:
